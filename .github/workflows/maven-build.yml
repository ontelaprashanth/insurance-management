
name: InsureX Backend Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build InsureX Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Checkout project source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Verify Java and Maven
      - name: Check Java version
        run: java -version

      - name: Compile InsureX Backend
        run: mvn -B -f backend/pom.xml clean compile

      

      # Compile and package backend
      - name: Build InsureX Backend
        run: mvn -B clean package -DskipTests
