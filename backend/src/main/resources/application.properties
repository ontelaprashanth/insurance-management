
# =========================================================
# INSUREX - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=insurance-management


# =========================================================
# SERVER CONFIGURATION - RENDER / VOROA
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF


# =========================================================
# RAZORPAY
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.currency=INR

# =========================================================
# INSUREX - AUTOMATIC REFUND STATUS SYNCHRONIZATION
# =========================================================

# Check Razorpay refund statuses every 5 minutes
insurex.refunds.sync-delay-ms=300000

# First check 1 minute after application startup
insurex.refunds.sync-initial-delay-ms=60000


# =========================================================
# MESSAGE CENTRAL OTP
# =========================================================

messagecentral.base-url=${MESSAGECENTRAL_BASE_URL:https://cpaas.messagecentral.com}
messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.key=${MESSAGECENTRAL_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL}

messagecentral.country-code=${MESSAGECENTRAL_COUNTRY_CODE:91}
messagecentral.flow-type=${MESSAGECENTRAL_FLOW_TYPE:SMS}
messagecentral.otp-length=${MESSAGECENTRAL_OTP_LENGTH:6}
messagecentral.otp-expiry-minutes=${MESSAGECENTRAL_OTP_EXPIRY_MINUTES:5}
messagecentral.max-attempts=${MESSAGECENTRAL_MAX_ATTEMPTS:5}


# =========================================================
# JWT AUTHENTICATION
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# =========================================================
# TIMEZONE
# =========================================================

spring.jackson.time-zone=Asia/Kolkata


# =========================================================
# TEMPORARY STARTUP DIAGNOSTICS
# =========================================================

logging.level.org.springframework.boot.context.config=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
