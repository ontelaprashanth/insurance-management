
# =========================================================
# INSUREX - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=insurance-management


# =========================================================
# SERVER CONFIGURATION - RENDER / VOROA
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# Fail startup if the embedded web server cannot start.
spring.main.web-application-type=servlet


# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.pool-name=InsureX-HikariPool

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1

# Close idle connections after 2 minutes.
spring.datasource.hikari.idle-timeout=120000

# Maximum connection lifetime: 10 minutes.
spring.datasource.hikari.max-lifetime=600000

# Do not keep extra idle connections alive.
spring.datasource.hikari.keepalive-time=0


# =========================================================
# JPA / HIBERNATE
# =========================================================

# IMPORTANT:
# Keep update temporarily while new settlement
# database columns are being created.
#
# After verifying schema migration, switch to
# validate or none as appropriate.

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Do not explicitly set MySQLDialect.
# Hibernate can detect it from the JDBC connection.

# Disable Open Session in View.
spring.jpa.open-in-view=false


# =========================================================
# RAZORPAY PAYMENT CONFIGURATION
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.currency=INR


# =========================================================
# AUTOMATIC REFUND STATUS SYNCHRONIZATION
# =========================================================

# Check pending Razorpay refunds every 5 minutes.
insurex.refunds.sync-delay-ms=300000

# First synchronization 1 minute after startup.
insurex.refunds.sync-initial-delay-ms=60000


# =========================================================
# MESSAGE CENTRAL OTP
# =========================================================

messagecentral.base-url=${MESSAGECENTRAL_BASE_URL:https://cpaas.messagecentral.com}

messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.key=${MESSAGECENTRAL_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL}

messagecentral.country-code=${MESSAGECENTRAL_COUNTRY_CODE:91}
messagecentral.flow-type=${MESSAGECENTRAL_FLOW_TYPE:SMS}

messagecentral.otp-length=${MESSAGECENTRAL_OTP_LENGTH:6}
messagecentral.otp-expiry-minutes=${MESSAGECENTRAL_OTP_EXPIRY_MINUTES:5}
messagecentral.max-attempts=${MESSAGECENTRAL_MAX_ATTEMPTS:5}


# =========================================================
# JWT AUTHENTICATION
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# =========================================================
# TIMEZONE
# =========================================================

spring.jackson.time-zone=Asia/Kolkata


# =========================================================
# LOGGING - PRODUCTION
# =========================================================

logging.level.root=INFO

logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO

logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

logging.level.com.zaxxer.hikari=INFO

logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.boot.context.config=INFO


# =========================================================
# STARTUP DIAGNOSTICS
# =========================================================

spring.main.log-startup-info=true
