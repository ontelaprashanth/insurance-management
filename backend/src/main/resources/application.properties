
spring.application.name=insurance-management

# ==========================================
# DATABASE - LOCAL DEFAULT URL
# Credentials are supplied through environment variables
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/htc-insurance?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Avoid logging SQL parameters that may contain sensitive data
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ==========================================
# RAZORPAY
# ==========================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

# ==========================================
# INSUREX - MESSAGE CENTRAL OTP
# ==========================================

messagecentral.base-url=https://cpaas.messagecentral.com
messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.key=${MESSAGECENTRAL_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL}
messagecentral.country-code=91
messagecentral.flow-type=SMS
messagecentral.otp-length=6
messagecentral.otp-expiry-minutes=5
messagecentral.max-attempts=5

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
