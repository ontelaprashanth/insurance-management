properties
# =========================================================
# INSUREX - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=insurance-management

# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-2948d0db-bangaru94413-335.e.aivencloud.com:24527/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# =========================================================
# LOGGING
# =========================================================

# Avoid logging SQL parameters and sensitive user data in production
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =========================================================
# SERVER - RENDER
# =========================================================

server.port=${PORT:8080}

# =========================================================
# RAZORPAY - TEST CONFIGURATION
# Configure these environment variables in Render
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

# =========================================================
# INSUREX - MESSAGE CENTRAL OTP
# =========================================================

messagecentral.base-url=${MESSAGECENTRAL_BASE_URL:https://cpaas.messagecentral.com}
messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.key=${MESSAGECENTRAL_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL}
messagecentral.country-code=91
messagecentral.flow-type=SMS
messagecentral.otp-length=6
messagecentral.otp-expiry-minutes=5
messagecentral.max-attempts=5

# =========================================================
# INSUREX - JWT CONFIGURATION
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# =========================================================
# TIMEZONE
# =========================================================

spring.jackson.time-zone=Asia/Kolkata
