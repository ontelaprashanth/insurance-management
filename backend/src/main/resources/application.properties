
# =========================================================
# INSUREX - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=insurance-management


# =========================================================
# SERVER CONFIGURATION - RENDER / VOROA
# =========================================================

# Render automatically provides PORT.
server.port=${PORT:8080}

# Allow Render to detect the HTTP listening port.
server.address=0.0.0.0

# Run as a servlet-based web application.
spring.main.web-application-type=servlet

# Display application startup information.
spring.main.log-startup-info=true


# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

# Configure these variables in Render Environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL - RENDER FREE
# =========================================================

spring.datasource.hikari.pool-name=InsureX-HikariPool

# Limit database connections for the free instance.
spring.datasource.hikari.maximum-pool-size=5

# Do not maintain unnecessary idle connections.
spring.datasource.hikari.minimum-idle=0

# Wait up to 20 seconds for an available connection.
spring.datasource.hikari.connection-timeout=20000

# Connection validation timeout.
spring.datasource.hikari.validation-timeout=5000

# Fail initialization if an initial connection cannot be made.
spring.datasource.hikari.initialization-fail-timeout=1

# Close idle connections after 2 minutes.
spring.datasource.hikari.idle-timeout=120000

# Maximum connection lifetime: 10 minutes.
spring.datasource.hikari.max-lifetime=600000

# Disable periodic connection keepalive.
spring.datasource.hikari.keepalive-time=0


# =========================================================
# JPA / HIBERNATE - PRODUCTION
# =========================================================

# Database migration completed for Settlement entity.
#
# VALIDATE:
# - Checks mapped tables and columns.
# - Does not automatically create or modify tables.
# - Prevents Hibernate auto-DDL operations on startup.
#
# IMPORTANT:
# All other entity mappings must also match the database.

spring.jpa.hibernate.ddl-auto=validate

# Disable SQL output in production.
spring.jpa.show-sql=false

# Avoid unnecessary SQL formatting.
spring.jpa.properties.hibernate.format_sql=false

# Preserve existing application timezone behavior.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Hibernate detects the MySQL dialect automatically.
# Do not set spring.jpa.database-platform.

# IMPORTANT:
# Keep the previous Open Session in View behavior
# until lazy-loading behavior has been verified.
spring.jpa.open-in-view=true


# =========================================================
# RAZORPAY PAYMENT CONFIGURATION
# =========================================================

# Configure Razorpay credentials in Render Environment.
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

razorpay.currency=INR


# =========================================================
# AUTOMATIC REFUND STATUS SYNCHRONIZATION
# =========================================================

# Check pending Razorpay refunds every 5 minutes.
insurex.refunds.sync-delay-ms=300000

# Start the first synchronization 1 minute after startup.
insurex.refunds.sync-initial-delay-ms=60000


# =========================================================
# MESSAGE CENTRAL - SMS OTP
# =========================================================

messagecentral.base-url=${MESSAGECENTRAL_BASE_URL:https://cpaas.messagecentral.com}

messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.key=${MESSAGECENTRAL_KEY}
messagecentral.email=${MESSAGECENTRAL_EMAIL}

messagecentral.country-code=${MESSAGECENTRAL_COUNTRY_CODE:91}
messagecentral.flow-type=${MESSAGECENTRAL_FLOW_TYPE:SMS}

messagecentral.otp-length=${MESSAGECENTRAL_OTP_LENGTH:6}
messagecentral.otp-expiry-minutes=${MESSAGECENTRAL_OTP_EXPIRY_MINUTES:5}
messagecentral.max-attempts=${MESSAGECENTRAL_MAX_ATTEMPTS:5}


# =========================================================
# JWT AUTHENTICATION
# =========================================================

jwt.secret=${JWT_SECRET}

# Default JWT expiration: 1 hour.
jwt.expiration=${JWT_EXPIRATION:3600000}


# =========================================================
# JSON / TIMEZONE
# =========================================================

spring.jackson.time-zone=Asia/Kolkata


# =========================================================
# LOGGING - PRODUCTION
# =========================================================

logging.level.root=INFO

logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO

logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

logging.level.com.zaxxer.hikari=INFO

logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.boot.context.config=INFO


# =========================================================
# STARTUP DIAGNOSTICS
# =========================================================

# Show initialization progress and startup failures.
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.boot.autoconfigure.orm.jpa=INFO


# =========================================================
# END OF INSUREX APPLICATION CONFIGURATION
# =========================================================
